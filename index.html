<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#38b9bd">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>جدول عادت‌سازی ۴۰۰ روزه</title>
<style>
:root{
  --bg:#f5f7f6; --card:#ffffff; --text:#4f5858; --muted:#889191;
  --teal:#38b9bd; --green:#25ad65; --green-bg:#d8f5e5;
  --yellow:#dca20f; --yellow-bg:#fff0b5;
  --red:#dc4747; --red-bg:#ffd6d6;
  --line:#e1e7e5; --neutral:#edf1ef; --dark:#586261;
}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#f7faf9 0,#f3f6f5 100%);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
.wrap{max-width:980px;margin:auto;padding:14px 12px 28px}
.panel{background:rgba(255,255,255,.97);border-radius:24px;padding:16px;margin-bottom:14px;border:1px solid #e9efed;box-shadow:0 8px 28px rgba(64,83,80,.055)}
h1{margin:4px 0 16px;text-align:center;color:var(--teal);font-size:28px;font-weight:800;letter-spacing:-.3px}
.habits-bar{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 12px;align-items:center;scrollbar-width:none}.habits-bar::-webkit-scrollbar{display:none}
.habit-tab,.add-habit{flex:0 0 auto;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;min-height:44px;transition:transform .12s ease,box-shadow .12s ease}
.habit-tab{border:1px solid var(--line);background:#fff;color:var(--text)}
.habit-tab.active{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 6px 14px rgba(56,185,189,.22)}
.add-habit{border:1px dashed #a9dddd;background:#effafa;color:#218f93}
.fields{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.fields{grid-template-columns:1fr 1.25fr 1fr}}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input[type=text],select{width:100%;padding:12px 13px;border:1px solid #dfe6e4;border-radius:14px;font-size:16px;background:#fff;color:var(--text);min-height:48px;outline:none;transition:border-color .15s ease,box-shadow .15s ease} input[type=text]:focus,select:focus{border-color:#8ed7d9;box-shadow:0 0 0 4px rgba(56,185,189,.10)}
.date-picker{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.date-info{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.date-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;background:#f1f9f8;color:#2a8589;font-size:12px;font-weight:700;border:1px solid #e1f1ef}
.active-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{background:#eaf8f8;color:#238d91;padding:7px 11px;border-radius:999px;font-weight:800;font-size:12px;border:1px solid #d8f0f0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;background:#fff;box-shadow:0 4px 14px rgba(64,83,80,.035)}
.stat b{display:block;font-size:23px;margin-top:4px}
.stat.small b{color:var(--green)} .stat.special b{color:var(--yellow)} .stat.urgent b{color:var(--red)}
.chillas{display:flex;gap:7px;overflow-x:auto;padding:3px 0 10px}
.chilla-btn{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;font-size:13px;color:var(--text);min-height:42px}
.chilla-btn.active{background:#66716f;color:#fff;border-color:#66716f;box-shadow:0 5px 14px rgba(66,78,76,.17)}
.chilla-btn.current::after{content:" •";color:#35c778;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
@media(min-width:390px){.grid{grid-template-columns:repeat(8,1fr)}}
@media(min-width:650px){.grid{grid-template-columns:repeat(10,1fr)}}
.cell{aspect-ratio:1/1;border:2px solid transparent;border-radius:12px;min-width:0;position:relative;font-weight:700;color:#596060;background:var(--neutral);padding:4px 2px;overflow:visible;transition:transform .1s ease,box-shadow .1s ease}
.cell .num{display:block;font-size:12px;line-height:1.2}
.cell .mini-date{display:block;font-size:8px;line-height:1.15;margin-top:2px;color:#727a7a;font-weight:400;direction:ltr}
.cell .mark{position:absolute;left:3px;bottom:3px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:900}
.cell.empty .mark{display:none}
.cell.small{background:var(--green-bg);border-color:#77d8a2}
.cell.small .mark{background:var(--green)}
.cell.special{background:var(--yellow-bg);border-color:#ebc94e}
.cell.special .mark{background:var(--yellow)}
.cell.urgent{background:var(--red-bg);border-color:#ea8585}
.cell.urgent .mark{background:var(--red)}
.cell.today-cell{outline:none}
.cell.selected-cell{outline:none;box-shadow:0 0 0 3px rgba(56,185,189,.42)}
.cell .today-pin{position:absolute;top:4px;left:4px;width:10px;height:10px;border-radius:50%;background:#2f83ff;box-shadow:0 0 0 2px #fff}
.detail{margin-top:14px;padding:12px 13px;border:1px solid #e2e9e7;border-radius:16px;font-size:13px;line-height:1.8;background:linear-gradient(180deg,#fcfdfd,#f8fbfa)}
.detail-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-row+.detail-row{border-top:1px solid #e8eceb;margin-top:9px;padding-top:9px}
.info-label{font-weight:800;color:#268f93;background:#e8f8f8;padding:6px 10px;border-radius:999px;border:1px solid #d8f0f0}
.info-label.selected{color:#596463;background:#edf1ef;border-color:#e0e6e4}
.status-pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-weight:800}
.status-pill.empty{background:#edf1ef;color:#697271}
.status-pill.small{background:var(--green-bg);color:#16854a}
.status-pill.special{background:var(--yellow-bg);color:#9b7300}
.status-pill.urgent{background:var(--red-bg);color:#bd3434}
.editor{display:grid;grid-template-columns:1fr;gap:11px;margin-top:14px}
.editor-row{display:grid;grid-template-columns:112px 1fr;gap:8px;align-items:center}
.editor-row span{font-weight:700;font-size:13px}
.legend-dot{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-weight:900;margin-left:4px}
.lg-small{background:var(--green)} .lg-special{background:var(--yellow)} .lg-urgent{background:var(--red)}
.toolbar-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media(min-width:760px){.toolbar-grid{grid-template-columns:repeat(3,1fr)}}
.action{width:100%;border:0;border-radius:15px;padding:13px 12px;font-size:14px;font-weight:800;min-height:52px;color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.055);transition:transform .1s ease,filter .1s ease;display:flex;align-items:center;justify-content:center;gap:8px}.action-icon{font-size:1.38em;font-weight:900;line-height:1;display:inline-flex;align-items:center;justify-content:center;min-width:1.15em}.action:active,.habit-tab:active,.add-habit:active,.cell:active{transform:scale(.98)}
.action.gray{background:#8e9997}
.action.teal{background:#39b6ba}
.action.yellow{background:#c79512}
.action.red{background:#dd4a4a}
.toolbar-separator{height:1px;background:#edf1ef;margin:15px 0 12px}
.danger-zone{background:#fff6f6;border:1px solid #fde0e0;border-radius:18px;padding:10px}
.danger-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.subtle{font-size:12px;color:var(--muted)}
.warn{color:#c85a32;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center;z-index:1000;padding:12px}
.overlay.show{display:flex}
.sheet{width:min(560px,100%);background:#fff;border-radius:26px 26px 20px 20px;padding:18px;box-shadow:0 18px 48px rgba(0,0,0,.24)}
.sheet-handle{width:44px;height:5px;border-radius:99px;background:#d8dddd;margin:0 auto 13px}
.sheet-title{text-align:center;font-weight:800;font-size:18px;margin-bottom:4px}
.sheet-date{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px}
.choice-grid{display:grid;grid-template-columns:1fr;gap:9px}
.choice{border:0;border-radius:16px;padding:14px 12px;font-size:16px;font-weight:800;color:#fff;min-height:54px}
.choice.small{background:var(--green)} .choice.special{background:var(--yellow);color:#5b4700}
.choice.urgent{background:var(--red)} .choice.clear{background:#edf1ef;color:#5e6867}
.close-sheet{width:100%;margin-top:9px;border:0;background:#fff;color:#7a8584;padding:11px;font-size:14px}
@media(max-width:360px){.grid{grid-template-columns:repeat(5,1fr)}.editor-row{grid-template-columns:1fr}.date-picker{gap:4px}select{padding:10px 6px}.toolbar-grid,.danger-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
  <h1>جدول عادت‌سازی</h1>
  <div class="habits-bar" id="habitTabs"></div>
  <div class="fields">
    <div class="field">
      <label>نام عادت</label>
      <input id="habitName" type="text" placeholder="مثلاً مطالعه روزانه">
    </div>
    <div class="field">
      <label>تاریخ شروع</label>
      <div class="date-picker">
        <select id="startYear" aria-label="سال"></select>
        <select id="startMonth" aria-label="ماه"></select>
        <select id="startDay" aria-label="روز"></select>
      </div>
      <div class="date-info">
        <span class="date-chip" id="todayChip">تاریخ امروز: —</span>
        <span class="date-chip" id="datePreview">شروع: —</span>
      </div>
    </div>
    <div class="field">
      <label>لقمه نهایی</label>
      <input id="finalGoal" type="text" placeholder="هدف نهایی این عادت">
    </div>
  </div>
</section>
<section class="panel">
  <div class="active-title">
    <strong>آمار چله فعلی بر اساس تاریخ امروز</strong>
    <span class="badge" id="activeBadge">تاریخ شروع را انتخاب کن</span>
  </div>
  <div class="stats">
    <div class="stat small">✅ لقمه کوچک<b id="smallCount">۰</b></div>
    <div class="stat special">🟡 لقمه ویژه<b id="specialCount">۰</b></div>
    <div class="stat urgent">🔴 لقمه اضطراری<b id="urgentCount">۰</b></div>
  </div>
</section>
<section class="panel">
  <div class="chillas" id="chillaTabs"></div>
  <div class="grid" id="grid"></div>
  <div class="detail" id="detail">وضعیت امروز اینجا نمایش داده می‌شود.</div>
</section>
<section class="panel">
  <div class="active-title">
    <strong id="editorTitle">لقمه‌های چله ۱</strong>
    <span class="badge">تعریف هر چله مستقل است</span>
  </div>
  <div class="editor">
    <div class="editor-row">
      <span><i class="legend-dot lg-small">✓</i>لقمه کوچک</span>
      <input id="smallText" type="text" placeholder="تعریف لقمه کوچک این چله">
    </div>
    <div class="editor-row">
      <span><i class="legend-dot lg-special">−</i>لقمه ویژه</span>
      <input id="specialText" type="text" placeholder="تعریف لقمه ویژه این چله">
    </div>
    <div class="editor-row">
      <span><i class="legend-dot lg-urgent">×</i>لقمه اضطراری</span>
      <input id="urgentText" type="text" placeholder="تعریف لقمه اضطراری این چله">
    </div>
  </div>
  <div class="toolbar-grid">
    <button class="action gray" id="undo" type="button"><span class="action-icon">↶</span><span>بازگشت یک مرحله</span></button>
    <button class="action yellow" id="duplicateHabit" type="button"><span class="action-icon">⧉</span><span>کپی از این عادت</span></button>
    <button class="action teal" id="exportBtn" type="button"><span class="action-icon">↓</span><span>فایل پشتیبان</span></button>
    <label class="action teal" for="importFile" style="cursor:pointer"><span class="action-icon">↑</span><span>بازیابی پشتیبان</span></label>
    <input id="importFile" type="file" accept=".json" hidden>
  </div>
  <div class="toolbar-separator"></div>
  <div class="danger-zone">
    <div class="danger-grid">
      <button class="action red" id="resetChilla" type="button"><span class="action-icon">⌫</span><span>پاک کردن چله</span></button>
      <button class="action red" id="deleteHabit" type="button"><span class="action-icon">🗑</span><span>حذف این عادت</span></button>
    </div>
  </div>
</section>
</div>
<div class="overlay" id="statusOverlay" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">انتخاب وضعیت</div>
    <div class="sheet-date" id="sheetDate"></div>
    <div class="choice-grid">
      <button class="choice small" type="button" data-status="1">✅ لقمه کوچک</button>
      <button class="choice special" type="button" data-status="2">➖ لقمه ویژه</button>
      <button class="choice urgent" type="button" data-status="3">❌ لقمه اضطراری</button>
      <button class="choice clear" type="button" data-status="0">پاک کردن وضعیت این روز</button>
    </div>
    <button class="close-sheet" id="closeSheet" type="button">بستن</button>
  </div>
</div>
<script>
const KEY="habit400-multi-v10";
const OLD_KEYS=["habit400-multi-v8","habit400-multi-v7","habit400-multi-v6","habit400-multi-v5","habit400-multi-v4","habit400-multi-v3","habit400-multi-v2","habit400-multi-v1"];
const TOTAL=400, CHILLA=40;
const faDigits="۰۱۲۳۴۵۶۷۸۹";
const toFa=s=>String(s).replace(/\d/g,d=>faDigits[d]);
const pad=n=>String(n).padStart(2,"0");
const div=(a,b)=>Math.trunc(a/b);
const mod=(a,b)=>a-Math.trunc(a/b)*b;
function jalCal(jy){const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178]; const bl=breaks.length; let gy=jy+621, leapJ=-14, jp=breaks[0], jm=0, jump=0; if(jy<jp || jy>=breaks[bl-1]) throw new Error("Jalali year out of range"); for(let i=1;i<bl;i++){ jm=breaks[i]; jump=jm-jp; if(jy<jm) break; leapJ+=div(jump,33)*8+div(mod(jump,33),4); jp=jm; } let n=jy-jp; leapJ+=div(n,33)*8+div(mod(n,33)+3,4); if(mod(jump,33)===4 && jump-n===4) leapJ++; const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150; const march=20+leapJ-leapG; if(jump-n<6) n=n-jump+div(jump+4,33)*33; let leap=mod(mod(n+1,33)-1,4); if(leap===-1) leap=4; return {leap,gy,march};}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408; d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752; return d;}
function d2g(jdn){let j=4*jdn+139361631; j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908; const i=div(mod(j,1461),4)*5+308; const gd=div(mod(i,153),5)+1; const gm=mod(div(i,153),12)+1; const gy=div(j,1461)-100100+div(8-gm,6); return {gy,gm,gd};}
function j2d(jy,jm,jd){const r=jalCal(jy); return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;}
function d2j(jdn){const g=d2g(jdn), jy=g.gy-621, r=jalCal(jy), jdn1f=g2d(g.gy,3,r.march); let k=jdn-jdn1f, jd, jm, outJy=jy; if(k>=0){if(k<=185){ jm=1+div(k,31); jd=mod(k,31)+1; return {jy:outJy,jm,jd}; } k-=186;} else {outJy-=1; k+=179; if(r.leap===1) k+=1;} jm=7+div(k,30); jd=mod(k,30)+1; return {jy:outJy,jm,jd};}
function formatJ(p){return toFa(`${p.jy}/${pad(p.jm)}/${pad(p.jd)}`)}
function shortJ(p){return toFa(`${pad(p.jm)}/${pad(p.jd)}`)}
function todayJ(){const d=new Date(); return d2j(g2d(d.getFullYear(),d.getMonth()+1,d.getDate()));}
function todayJdn(){const d=new Date(); return g2d(d.getFullYear(),d.getMonth()+1,d.getDate());}
function daysInJMonth(jy,jm){if(jm<=6)return 31; if(jm<=11)return 30; return jalCal(jy).leap===0?30:29;}
function makeHabit(name="عادت جدید"){return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,start:{jy:null,jm:null,jd:null},finalGoal:"",cells:Array(TOTAL).fill(0),texts:Array.from({length:10},()=>({small:"",special:"",urgent:""})),history:[]};}
let state={habits:[makeHabit("عادت ۱")],activeId:null}; let viewChilla=0, selectedCell=null;
function migrateHabit(h){if(!h.start){h.start={jy:null,jm:null,jd:null}; if(h.startDate){const s=String(h.startDate).replace(/[۰-۹]/g,d=>String(faDigits.indexOf(d))).replace(/[-.]/g,"/"); const m=s.match(/^(\d{3,4})\/(\d{1,2})\/(\d{1,2})$/); if(m) h.start={jy:+m[1],jm:+m[2],jd:+m[3]};}} if(!Array.isArray(h.cells)||h.cells.length!==TOTAL)h.cells=Array(TOTAL).fill(0); h.cells=h.cells.map(x=>typeof x==="object"?(Number(x.s)||0):(Number(x)||0)); if(!Array.isArray(h.texts)||h.texts.length!==10)h.texts=Array.from({length:10},()=>({small:"",special:"",urgent:""})); if(!Array.isArray(h.history))h.history=[];}
function load(){let raw=localStorage.getItem(KEY); if(!raw){for(const k of OLD_KEYS){const x=localStorage.getItem(k); if(x){raw=x; break}}} try{const x=JSON.parse(raw||"null"); if(x&&Array.isArray(x.habits)&&x.habits.length)state=x;}catch(e){} for(const h of state.habits)migrateHabit(h); if(!state.activeId||!state.habits.some(h=>h.id===state.activeId))state.activeId=state.habits[0].id;}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function activeHabit(){return state.habits.find(h=>h.id===state.activeId)||state.habits[0]}
function validStart(h){const s=h.start; if(!s||!s.jy||!s.jm||!s.jd)return null; try{if(s.jd>daysInJMonth(s.jy,s.jm))return null; return {...s,jdn:j2d(s.jy,s.jm,s.jd)};}catch(e){return null}}
function fillDateSelectors(){startYear.innerHTML='<option value="">سال</option>'; for(let y=1390;y<=1465;y++){const o=document.createElement("option"); o.value=y; o.textContent=toFa(y); startYear.appendChild(o);} startMonth.innerHTML='<option value="">ماه</option>'; for(let m=1;m<=12;m++){const o=document.createElement("option"); o.value=m; o.textContent=toFa(m); startMonth.appendChild(o);} startDay.innerHTML='<option value="">روز</option>'; for(let d=1;d<=31;d++){const o=document.createElement("option"); o.value=d; o.textContent=toFa(d); startDay.appendChild(o);}}
function refillDays(){const y=+startYear.value,m=+startMonth.value,old=+startDay.value||1; const max=(y&&m)?daysInJMonth(y,m):31; startDay.innerHTML='<option value="">روز</option>'; for(let d=1;d<=max;d++){const o=document.createElement("option"); o.value=d; o.textContent=toFa(d); startDay.appendChild(o);} if(old<=max)startDay.value=old;}
function syncStartFromUI(){const h=activeHabit(); h.start={jy:startYear.value?+startYear.value:null,jm:startMonth.value?+startMonth.value:null,jd:startDay.value?+startDay.value:null}; save(); renderStats(); renderChillas(); renderGrid(); renderDetail(); renderDatePreview();}
function renderDatePreview(){const p=validStart(activeHabit()); datePreview.textContent=p?`شروع: ${formatJ(p)}`:"شروع: —";}
function renderTodayChip(){todayChip.textContent=`تاریخ امروز: ${formatJ(todayJ())}`;}
function renderFields(){const h=activeHabit(); habitName.value=h.name||""; finalGoal.value=h.finalGoal||""; startYear.value=h.start?.jy||""; startMonth.value=h.start?.jm||""; refillDays(); startDay.value=h.start?.jd||""; renderDatePreview(); renderTodayChip();}
startYear.addEventListener("change",()=>{refillDays(); syncStartFromUI()}); startMonth.addEventListener("change",()=>{refillDays(); syncStartFromUI()}); startDay.addEventListener("change",syncStartFromUI);
function renderHabitTabs(){habitTabs.innerHTML=""; for(const h of state.habits){const b=document.createElement("button"); b.type="button"; b.className="habit-tab"+(h.id===state.activeId?" active":""); b.textContent=h.name||"بدون نام"; b.addEventListener("click",()=>{state.activeId=h.id; viewChilla=0; selectedCell=null; save(); renderAll()}); habitTabs.appendChild(b);} const add=document.createElement("button"); add.type="button"; add.className="add-habit"; add.textContent="＋ عادت جدید"; add.addEventListener("click",()=>{const n=prompt("نام عادت جدید را بنویس:","عادت "+toFa(state.habits.length+1)); if(n===null)return; const h=makeHabit(n.trim()||("عادت "+toFa(state.habits.length+1))); state.habits.push(h); state.activeId=h.id; viewChilla=0; selectedCell=null; save(); renderAll();}); habitTabs.appendChild(add);}
function currentIndexByDate(h){const p=validStart(h); if(!p)return null; return todayJdn()-p.jdn;}
function currentChilla(h){const idx=currentIndexByDate(h); if(idx===null)return null; if(idx<0)return 0; if(idx>=TOTAL)return 9; return Math.floor(idx/CHILLA);}
function renderStats(){const h=activeHabit(),cc=currentChilla(h),idx=currentIndexByDate(h); if(cc===null){activeBadge.textContent="تاریخ شروع را انتخاب کن"; smallCount.textContent=specialCount.textContent=urgentCount.textContent="۰"; return;} if(idx<0){activeBadge.textContent=`چله ${toFa(1)} · روز ${toFa(1)} از ${toFa(40)} · هنوز شروع نشده`;} else if(idx>=TOTAL){activeBadge.textContent="دوره ۴۰۰ روزه تمام شده";} else {const dayOfChilla=(idx%CHILLA)+1; activeBadge.textContent=`چله ${toFa(cc+1)} · روز ${toFa(dayOfChilla)} از ${toFa(40)}`;} const st=cc*CHILLA,en=st+CHILLA; let a=0,b=0,c=0; for(let i=st;i<en;i++){if(h.cells[i]===1)a++; if(h.cells[i]===2)b++; if(h.cells[i]===3)c++;} smallCount.textContent=toFa(a); specialCount.textContent=toFa(b); urgentCount.textContent=toFa(c);}
function renderChillas(){chillaTabs.innerHTML=""; const h=activeHabit(),cc=currentChilla(h); for(let c=0;c<10;c++){const b=document.createElement("button"); b.type="button"; b.className="chilla-btn"+(viewChilla===c?" active":"")+(cc===c?" current":""); b.textContent=`چله ${toFa(c+1)} · ${toFa(c*40+1)}–${toFa(c*40+40)}`; b.addEventListener("click",()=>{viewChilla=c; selectedCell=null; renderAll()}); chillaTabs.appendChild(b);}}
function dateForCell(h,i){const p=validStart(h); if(!p)return null; return d2j(p.jdn+i);}
function renderGrid(){const h=activeHabit(); grid.innerHTML=""; const start=viewChilla*CHILLA,cls=["empty","small","special","urgent"],mark=["","✓","−","×"]; const todayIdx=currentIndexByDate(h); for(let i=start;i<start+CHILLA;i++){const st=h.cells[i]||0,dt=dateForCell(h,i); const isToday=(todayIdx!==null && todayIdx===i && i>=0 && i<TOTAL); const b=document.createElement("button"); b.type="button"; const isSelected=(selectedCell===i); b.className=`cell ${cls[st]}${isToday?" today-cell":""}${isSelected?" selected-cell":""}`; b.innerHTML=`<span class="num">${toFa(i+1)}</span><span class="mini-date">${dt?shortJ(dt):"—"}</span>${isToday?'<span class="today-pin"></span>':''}<span class="mark">${mark[st]}</span>`; b.addEventListener("click",()=>openStatusMenu(i)); grid.appendChild(b);}}
function renderDetail(){
  const h=activeHabit(), p=validStart(h);
  if(!p){ detail.innerHTML=`<span class="warn">برای نمایش وضعیت امروز، تاریخ شروع را مشخص کن.</span>`; return; }
  const idx=currentIndexByDate(h);
  const names=["ثبت نشده","لقمه کوچک","لقمه ویژه","لقمه اضطراری"];
  const icons=["○","✓","−","×"];
  const classes=["empty","small","special","urgent"];
  let html="";
  if(idx<0){
    html=`<div class="detail-row"><span class="info-label">امروز</span><span>این عادت هنوز شروع نشده</span><span>شروع: <b>${formatJ(p)}</b></span></div>`;
  }else if(idx>=TOTAL){
    html=`<div class="detail-row"><span class="info-label">امروز</span><span>دوره ۴۰۰ روزه این عادت تمام شده است.</span></div>`;
  }else{
    const st=h.cells[idx]||0, dt=dateForCell(h,idx);
    html=`<div class="detail-row"><span class="info-label">امروز</span><b>روز ${toFa(idx+1)}</b><span>${formatJ(dt)}</span><span class="status-pill ${classes[st]}">${icons[st]} ${names[st]}</span></div>`;
  }
  if(selectedCell!==null && selectedCell!==idx){
    const st=h.cells[selectedCell]||0, dt=dateForCell(h,selectedCell);
    html+=`<div class="detail-row"><span class="info-label selected">انتخاب‌شده</span><b>روز ${toFa(selectedCell+1)}</b><span>${dt?formatJ(dt):"—"}</span><span class="status-pill ${classes[st]}">${icons[st]} ${names[st]}</span></div>`;
  }
  detail.innerHTML=html;
}
function openStatusMenu(i){selectedCell=i; const h=activeHabit(),dt=dateForCell(h,i); renderGrid(); renderDetail(); sheetTitle.textContent=`روز ${toFa(i+1)}`; sheetDate.textContent=dt?formatJ(dt):"ابتدا تاریخ شروع را انتخاب کن"; statusOverlay.classList.add("show");}
function closeStatusMenu(){statusOverlay.classList.remove("show")}
closeSheet.addEventListener("click",closeStatusMenu); statusOverlay.addEventListener("click",e=>{if(e.target===statusOverlay)closeStatusMenu()}); document.querySelectorAll('.choice[data-status]').forEach(btn=>{btn.addEventListener('click',()=>{if(selectedCell===null)return; const h=activeHabit(),newStatus=+btn.dataset.status,prev=h.cells[selectedCell]||0; if(prev!==newStatus){h.history.push({i:selectedCell,prev}); h.cells[selectedCell]=newStatus; save();} closeStatusMenu(); renderStats(); renderGrid(); renderDetail();});});
function renderEditor(){const h=activeHabit(),t=h.texts[viewChilla]; editorTitle.textContent=`لقمه‌های چله ${toFa(viewChilla+1)} — ${h.name||"بدون نام"}`; smallText.value=t.small||""; specialText.value=t.special||""; urgentText.value=t.urgent||"";}
function renderAll(){renderHabitTabs(); renderFields(); renderStats(); renderChillas(); renderGrid(); renderDetail(); renderEditor();}
habitName.addEventListener("input",e=>{activeHabit().name=e.target.value; save(); renderHabitTabs(); renderEditor()});
finalGoal.addEventListener("input",e=>{activeHabit().finalGoal=e.target.value; save()});
smallText.addEventListener("input",e=>{activeHabit().texts[viewChilla].small=e.target.value; save()});
specialText.addEventListener("input",e=>{activeHabit().texts[viewChilla].special=e.target.value; save()});
urgentText.addEventListener("input",e=>{activeHabit().texts[viewChilla].urgent=e.target.value; save()});
undo.addEventListener("click",()=>{const h=activeHabit(),x=h.history.pop(); if(!x)return; h.cells[x.i]=x.prev; selectedCell=x.i; save(); renderStats(); renderGrid(); renderDetail();});
resetChilla.addEventListener("click",()=>{if(!confirm("وضعیت ۴۰ روز همین چله پاک شود؟"))return; const h=activeHabit(),st=viewChilla*CHILLA; for(let i=st;i<st+CHILLA;i++)h.cells[i]=0; h.history=[]; selectedCell=null; save(); renderAll();});
deleteHabit.addEventListener("click",()=>{if(state.habits.length===1){alert("حداقل یک عادت باید باقی بماند."); return} const h=activeHabit(); if(!confirm(`عادت «${h.name||"بدون نام"}» کامل حذف شود؟`))return; state.habits=state.habits.filter(x=>x.id!==h.id); state.activeId=state.habits[0].id; viewChilla=0; selectedCell=null; save(); renderAll();});
duplicateHabit.addEventListener("click",()=>{const src=activeHabit(),copy=JSON.parse(JSON.stringify(src)); copy.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); copy.name=(src.name||"عادت")+" - کپی"; copy.history=[]; state.habits.push(copy); state.activeId=copy.id; viewChilla=0; selectedCell=null; save(); renderAll();});
exportBtn.addEventListener("click",()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="habit-tracker-400-backup.json"; a.click(); URL.revokeObjectURL(a.href);});
importFile.addEventListener("change",e=>{const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{const x=JSON.parse(r.result); if(!x||!Array.isArray(x.habits)||!x.habits.length)throw 0; state=x; for(const h of state.habits)migrateHabit(h); if(!state.activeId||!state.habits.some(h=>h.id===state.activeId))state.activeId=state.habits[0].id; save(); viewChilla=0; selectedCell=null; renderAll(); alert("پشتیبان بازیابی شد.");}catch(err){alert("فایل پشتیبان معتبر نیست.")}}; r.readAsText(f); e.target.value="";});
fillDateSelectors(); load(); renderAll();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

</script>
